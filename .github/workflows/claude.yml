name: Claude

# Runs when the repo owner tags @claude in an issue, PR comment, or PR review.
# Uses the same subscription OAuth token as the weekly update workflow.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Only the repo owner can trigger this. Every run spends the owner's
    # subscription, so do not widen this to MEMBER/CONTRIBUTOR without thought.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The default sandbox blocks git fetch/merge, so list the commands Claude may use
          # to resolve conflicts and merge pull requests.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(git fetch:*),Bash(git merge:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git config:*),Bash(git remote:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr merge:*),Bash(gh pr comment:*),Bash(curl:*)"
            --append-system-prompt "This repo is a curated list. Contributors open pull requests from forks, and the GITHUB_TOKEN cannot push to a fork branch. To resolve a conflict and merge a pull request: (1) fetch the PR head with 'git fetch origin pull/<N>/head:pr<N>'; (2) on main, run 'git merge --no-ff pr<N>'; (3) resolve README.md conflicts by keeping BOTH sides, because conflicts are usually two rows added at the end of one table; remove all conflict markers; (4) commit with the message 'Merge pull request #<N> from <author>/<branch>'; (5) push to main with 'git push origin main'. GitHub then marks the pull request as merged. Before merging, check that the entry link works and follows contributing.md. Only merge when the repo owner asked for a merge."
